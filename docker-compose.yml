services:
  yt-dlp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt-dlp-download
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://100.67.62.64:8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./downloads:/downloads

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: yt-dlp-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "${MONITORING_BIND_ADDRESS:-0.0.0.0}:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - node-exporter
      - cadvisor

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: yt-dlp-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro
    expose:
      - "9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: yt-dlp-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    expose:
      - "8080"

  grafana:
    image: grafana/grafana:12.1.1
    container_name: yt-dlp-grafana
    restart: unless-stopped
    ports:
      - "${MONITORING_BIND_ADDRESS:-0.0.0.0}:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-now}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
